name: Validar agente de inventario

on:
  push:
    branches: [main]
    paths:
      - services/inventory-agent/**
      - .github/workflows/inventory-agent.yml
  pull_request:
    paths:
      - services/inventory-agent/**
      - .github/workflows/inventory-agent.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: inventory_agent_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventory_agent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      INVENTORY_AGENT_TEST_CONNECTION: 'Host=localhost;Port=5432;Database=inventory_agent_test;Username=postgres;Password=isolated_ci_test_only;SSL Mode=Disable'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Compilar y probar con PostgreSQL aislado
        run: dotnet test services/inventory-agent/tests/InventoryAgent.Tests.csproj --configuration Release --logger 'trx;LogFileName=inventory-agent.trx'
      - name: Revisar dependencias
        shell: pwsh
        run: |
          $report = dotnet list services/inventory-agent/InventoryAgent.csproj package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audit = ($report -join "`n") | ConvertFrom-Json
          foreach ($project in $audit.projects) {
            foreach ($framework in $project.frameworks) {
              foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                if ($package.vulnerabilities.Count -gt 0) { throw "Dependencia vulnerable: $($package.id)" }
              }
            }
          }
          Write-Output 'No se encontraron vulnerabilidades conocidas.'
