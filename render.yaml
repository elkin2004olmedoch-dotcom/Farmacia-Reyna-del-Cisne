services:
  - type: web
    name: farmacia-reina-del-cisne
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run setup:production
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: farmacia-reina-del-cisne
          envVarKey: RENDER_EXTERNAL_URL
      - key: IMAGE_STORAGE
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: farmaciaproductos
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SKIP_INITIAL_SEED
        value: 'true'
